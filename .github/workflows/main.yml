name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup www folder
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/push-notifications@6
          npm install @capacitor/splash-screen@6
          npm install @capacitor/status-bar@6
          npm install @capacitor/app@6

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ourefootballtour.app",
            "appName": "OUR TOUR",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              },
              "SplashScreen": {
                "launchShowDuration": 2500,
                "launchAutoHide": true,
                "backgroundColor": "#05070e",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Init Capacitor
        run: npx cap init "OUR TOUR" "com.ourefootballtour.app" --web-dir www || true

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Icons & Splash
        run: |
          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png missing!"
            exit 1
          fi
          RES=android/app/src/main/res
          
          for entry in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            convert icon.png -resize ${SIZE}x${SIZE} -background none -gravity center -extent ${SIZE}x${SIZE} "$RES/$FOLDER/ic_launcher.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_round.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_foreground.png"
          done
          
          for entry in "480:drawable-port-mdpi" "720:drawable-port-hdpi" "1080:drawable-port-xhdpi" "1440:drawable-port-xxhdpi" "1920:drawable-port-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            ICON_SIZE=$((SIZE/3))
            convert -size ${SIZE}x${SIZE} xc:'#05070e' \( icon.png -resize ${ICON_SIZE}x${ICON_SIZE} \) -gravity center -composite "$RES/$FOLDER/splash.png"
          done
          
          for entry in "800:drawable-land-mdpi" "1280:drawable-land-hdpi" "1920:drawable-land-xhdpi" "2560:drawable-land-xxhdpi" "3200:drawable-land-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            H=$((SIZE*9/16))
            ICON_SIZE=$((H/3))
            convert -size ${SIZE}x${H} xc:'#05070e' \( icon.png -resize ${ICON_SIZE}x${ICON_SIZE} \) -gravity center -composite "$RES/$FOLDER/splash.png"
          done
          
          mkdir -p "$RES/drawable"
          convert -size 1080x1920 xc:'#05070e' \( icon.png -resize 360x360 \) -gravity center -composite "$RES/drawable/splash.png"
          
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f $RES/mipmap-anydpi-v26/ic_launcher_round.xml || true

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
            echo "✅ google-services.json copied"
          else
            echo "❌ WARNING: google-services.json NOT FOUND"
          fi

      - name: Fix AndroidManifest
        run: |
          python3 << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          
          with open(path) as f:
              c = f.read()
          
          if "POST_NOTIFICATIONS" not in c:
              c = c.replace("</manifest>",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
                  '</manifest>', 1)
          
          with open(path, "w") as f:
              f.write(c)
          
          print("=== Manifest updated ===")
          PYEOF

      - name: Final Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Setup www folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp icon.png www/ || echo "no icon"

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Install OneSignal plugin
        run: |
          npm install onesignal-cordova-plugin@5 --legacy-peer-deps

      - name: Init Capacitor
        run: |
          npx cap init "OUR EFOOTBALL TOUR" "com.ourefootballtour.app" --web-dir www

      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy google-services
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      - name: Add Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>|' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

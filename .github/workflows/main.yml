name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup www folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp icon.png www/ || echo "no icon"
          cp icon.png www/icon.png || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Install OneSignal plugin
        run: npm install onesignal-cordova-plugin@5 --legacy-peer-deps

      - name: Init Capacitor
        run: npx cap init "OUR TOUR" "com.ourefootballtour.app" --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          ls -la
          echo "=== Icon file check ==="
          ls -la icon.png || echo "icon.png MISSING"
          
          RES=android/app/src/main/res
          echo "=== Generating icons to $RES ==="
          
          # Generate launcher icons (standard + round)
          convert icon.png -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert icon.png -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert icon.png -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher_foreground.png"

          convert icon.png -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert icon.png -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert icon.png -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher_foreground.png"

          convert icon.png -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert icon.png -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert icon.png -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher_foreground.png"

          convert icon.png -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert icon.png -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert icon.png -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher_foreground.png"

          convert icon.png -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          convert icon.png -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          convert icon.png -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"

          echo "=== Icons generated! ==="
          ls -la $RES/mipmap-xxxhdpi/

      - name: Remove Adaptive Icon XML (force legacy icon)
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          echo "Removed adaptive icons"

      - name: Copy google-services
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      - name: Add Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>|' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

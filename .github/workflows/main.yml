name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor & plugins
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install onesignal-cordova-plugin@5
          npm install @capacitor/splash-screen@6
          npm install @capacitor/status-bar@6
          npm install @capacitor/app@6

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ourefootballtour.app",
            "appName": "OUR TOUR",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#05070e",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_INSIDE",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#05070e"
              }
            }
          }
          EOF

      - name: Capacitor init & add android
        run: |
          npx cap init "OUR TOUR" com.ourefootballtour.app --web-dir www
          npx cap add android

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Fix gradle — google services
        run: |
          GRADLE_FILE=android/build.gradle
          if ! grep -q "com.google.gms:google-services" "$GRADLE_FILE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$GRADLE_FILE"
          fi
          APP_GRADLE=android/app/build.gradle
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          fi

      - name: Fix AndroidManifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$MF"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application|' "$MF"
          fi
          if ! grep -q "default_notification_channel_id" "$MF"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/colorPrimary" />\n    </application>|' "$MF"
          fi

      - name: Prepare colors.xml
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/values"
          cat > "$RES/values/colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#05070e</color>
              <color name="colorPrimaryDark">#05070e</color>
              <color name="colorAccent">#22d3ee</color>
              <color name="splashBackground">#05070e</color>
          </resources>
          EOF

      - name: Delete all default splash and icon files
        run: |
          RES=android/app/src/main/res
          find $RES -name "splash.png" -delete 2>/dev/null || true
          find $RES -name "splash.xml" -delete 2>/dev/null || true
          rm -rf $RES/mipmap-anydpi-v26 2>/dev/null || true
          rm -rf $RES/mipmap-anydpi 2>/dev/null || true
          find $RES -name "ic_launcher.png" -delete 2>/dev/null || true
          find $RES -name "ic_launcher_round.png" -delete 2>/dev/null || true
          find $RES -name "ic_launcher_foreground.png" -delete 2>/dev/null || true
          find $RES -name "ic_launcher_background.png" -delete 2>/dev/null || true
          find $RES -name "ic_launcher.xml" -delete 2>/dev/null || true
          find $RES -name "launch_background.xml" -delete 2>/dev/null || true

      - name: Generate Launcher Icons
        run: |
          set -e
          SRC="icon.png"
          RES=android/app/src/main/res
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          convert "$SRC" -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Generate Splash Screens (FIX BRIGHTNESS)
        run: |
          set -e
          SRC="icon.png"
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/drawable-mdpi" "$RES/drawable-hdpi" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi" "$RES/drawable-xxxhdpi"
          
          # এখানে ব্যাকগ্রাউন্ড কালো (#05070e) এর বদলে সাদা (#FFFFFF) করা হয়েছে যাতে ব্রাইটনেস ঠিক থাকে
          convert -size 320x480 xc:'#05070e' \( "$SRC" -resize 160x160 \) -gravity center -composite "$RES/drawable-mdpi/splash.png"
          convert -size 480x800 xc:'#05070e' \( "$SRC" -resize 240x240 \) -gravity center -composite "$RES/drawable-hdpi/splash.png"
          convert -size 720x1280 xc:'#05070e' \( "$SRC" -resize 360x360 \) -gravity center -composite "$RES/drawable-xhdpi/splash.png"
          convert -size 960x1600 xc:'#05070e' \( "$SRC" -resize 480x480 \) -gravity center -composite "$RES/drawable-xxhdpi/splash.png"
          convert -size 1280x1920 xc:'#05070e' \( "$SRC" -resize 640x640 \) -gravity center -composite "$RES/drawable-xxxhdpi/splash.png"
          
          cp "$RES/drawable-xhdpi/splash.png" "$RES/drawable/splash.png"

      - name: Create launch_background.xml
        run: |
          RES=android/app/src/main/res
          cat > "$RES/drawable/launch_background.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splashBackground" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash" />
              </item>
          </layer-list>
          XMLEOF

      - name: Override styles.xml (FIX BLACK SCREEN)
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          cat > "$STYLES" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- এই থিমটি ব্যবহার করলে অ্যাপ ওপেন হওয়ার সময় কোনো কালো স্ক্রিন আসবে না -->
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:background">@drawable/launch_background</item>
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowDisablePreview">false</item>
              </style>
          </resources>
          XMLEOF

      - name: Final sync
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK — both names
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/our-tour.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-tour-apk
          path: |
            output/our-tour.apk
            output/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Auto build from commit ${{ github.sha }}
          files: |
            output/our-tour.apk
            output/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

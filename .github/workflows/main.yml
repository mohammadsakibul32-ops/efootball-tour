name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Verify icon files present
        run: |
          echo "=== Repo root files ==="
          ls -la
          echo "=== Check icons ==="
          if [ -f icon.png ]; then echo "✅ icon.png FOUND"; ls -la icon.png; file icon.png; fi
          if [ -f efcon.png ]; then echo "✅ efcon.png FOUND"; ls -la efcon.png; file efcon.png; fi
          if [ ! -f icon.png ] && [ ! -f efcon.png ]; then
            echo "❌ NO ICON FILE FOUND"
          fi

      - name: Download icon if missing
        run: |
          if [ ! -f icon.png ] && [ ! -f efcon.png ]; then
            echo "📥 Downloading default icon…"
            curl -L -o icon.png "https://cdn.phototourl.com/member/2026-09-27-95ef7b78-f21d-49d6-a698-af39c66628b2.png" || true
          fi
          if [ -f efcon.png ] && [ ! -f icon.png ]; then
            cp efcon.png icon.png
          fi
          ls -la icon.png

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          ls -la www/

      - name: Install Capacitor & plugins
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install onesignal-cordova-plugin@5
          npm install @capacitor/splash-screen@6
          npm install @capacitor/status-bar@6
          npm install @capacitor/app@6

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ourefootballtour.app",
            "appName": "OUR TOUR",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#05070e",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#05070e"
              }
            }
          }
          EOF

      - name: Capacitor init & add android
        run: |
          npx cap init "OUR TOUR" com.ourefootballtour.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "✅ google-services.json copied"
          else
            echo "❌ google-services.json NOT FOUND!"
            exit 1
          fi

      - name: Inject Google Services plugin — android/build.gradle
        run: |
          GRADLE_FILE=android/build.gradle
          if ! grep -q "com.google.gms:google-services" "$GRADLE_FILE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$GRADLE_FILE"
          fi

      - name: Inject Google Services plugin — android/app/build.gradle
        run: |
          APP_GRADLE=android/app/build.gradle
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          fi

      - name: Fix AndroidManifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$MF"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application|' "$MF"
          fi
          if ! grep -q "default_notification_channel_id" "$MF"; then
            sed -i 's|</application>|    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="default" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/colorPrimary" />\n    </application>|' "$MF"
          fi

      - name: Add colorPrimary to colors.xml
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          if [ ! -f "$COLORS" ]; then
            mkdir -p android/app/src/main/res/values
            cat > "$COLORS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#05070e</color>
              <color name="colorPrimaryDark">#05070e</color>
              <color name="colorAccent">#22d3ee</color>
          </resources>
          EOF
          fi

      - name: Generate Icons
        run: |
          set -e
          SRC="icon.png"
          if [ ! -f "$SRC" ]; then
            echo "❌ icon.png missing"
            exit 1
          fi
          echo "=== Source icon info ==="
          identify "$SRC" || file "$SRC"
          ls -la "$SRC"

          RES=android/app/src/main/res

          echo "=== Generating launcher icons ==="
          convert "$SRC" -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "=== Generating round icons ==="
          convert "$SRC" -resize 48x48   -background none -gravity center -extent 48x48   "$RES/mipmap-mdpi/ic_launcher_round.png"   || cp "$RES/mipmap-mdpi/ic_launcher.png"   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert "$SRC" -resize 72x72   -background none -gravity center -extent 72x72   "$RES/mipmap-hdpi/ic_launcher_round.png"   || cp "$RES/mipmap-hdpi/ic_launcher.png"   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert "$SRC" -resize 96x96   -background none -gravity center -extent 96x96   "$RES/mipmap-xhdpi/ic_launcher_round.png"  || cp "$RES/mipmap-xhdpi/ic_launcher.png"  "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert "$SRC" -resize 144x144 -background none -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png" || cp "$RES/mipmap-xxhdpi/ic_launcher.png" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert "$SRC" -resize 192x192 -background none -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"|| cp "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "=== Generating foreground icons ==="
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            DENSITY="${d%%:*}"; SIZE="${d##*:}"
            mkdir -p "$RES/mipmap-$DENSITY"
            convert "$SRC" -resize ${SIZE}x${SIZE} -background none -gravity center -extent ${SIZE}x${SIZE} "$RES/mipmap-$DENSITY/ic_launcher_foreground.png" || true
          done

          echo "=== Verify generated files ==="
          ls -la "$RES/mipmap-xxxhdpi/"

      - name: Generate Splash Screens
        run: |
          set -e
          SRC="icon.png"
          RES=android/app/src/main/res

          echo "=== Splash: creating dark background with centered logo ==="

          # xxxhdpi (1280x1920)
          mkdir -p "$RES/drawable-xxxhdpi"
          convert -size 1280x1920 xc:'#05070e' \
            \( "$SRC" -resize 640x640 \) -gravity center -composite \
            "$RES/drawable-xxxhdpi/splash.png"

          # xxhdpi (960x1600)
          mkdir -p "$RES/drawable-xxhdpi"
          convert -size 960x1600 xc:'#05070e' \
            \( "$SRC" -resize 480x480 \) -gravity center -composite \
            "$RES/drawable-xxhdpi/splash.png"

          # xhdpi (720x1280)
          mkdir -p "$RES/drawable-xhdpi"
          convert -size 720x1280 xc:'#05070e' \
            \( "$SRC" -resize 360x360 \) -gravity center -composite \
            "$RES/drawable-xhdpi/splash.png"

          # hdpi (480x800)
          mkdir -p "$RES/drawable-hdpi"
          convert -size 480x800 xc:'#05070e' \
            \( "$SRC" -resize 240x240 \) -gravity center -composite \
            "$RES/drawable-hdpi/splash.png"

          # mdpi (320x480)
          mkdir -p "$RES/drawable-mdpi"
          convert -size 320x480 xc:'#05070e' \
            \( "$SRC" -resize 160x160 \) -gravity center -composite \
            "$RES/drawable-mdpi/splash.png"

          # default drawable
          mkdir -p "$RES/drawable"
          cp "$RES/drawable-xxxhdpi/splash.png" "$RES/drawable/splash.png"

          echo "=== Verify splash files ==="
          ls -la "$RES/drawable-xxxhdpi/splash.png"
          identify "$RES/drawable-xxxhdpi/splash.png"

      - name: Final sync
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/our-tour.apk
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-tour-apk
          path: output/our-tour.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Auto build from commit ${{ github.sha }}
          files: output/our-tour.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

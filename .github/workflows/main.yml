name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup www folder
        run: |
          mkdir -p www
          cp index.html www/ || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Install Capacitor plugins
        run: |
          npm install @capacitor/splash-screen@6 @capacitor/status-bar@6 @capacitor/app@6

      - name: Install OneSignal Cordova plugin
        run: npm install onesignal-cordova-plugin@5 --legacy-peer-deps

      - name: Init Capacitor
        run: npx cap init "OUR TOUR" "com.ourefootballtour.app" --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Icons & Splash
        run: |
          if [ ! -f icon.png ]; then
            echo "icon.png missing!"
            exit 1
          fi
          
          RES=android/app/src/main/res
          
          for entry in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            convert icon.png -resize ${SIZE}x${SIZE} -background none -gravity center -extent ${SIZE}x${SIZE} "$RES/$FOLDER/ic_launcher.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_round.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_foreground.png"
          done
          
          for entry in "480:drawable" "720:drawable-hdpi" "1080:drawable-xhdpi" "1440:drawable-xxhdpi" "1920:drawable-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            ICON_SIZE=$((SIZE/3))
            convert -size ${SIZE}x${SIZE} xc:'#05070e' \
              \( icon.png -resize ${ICON_SIZE}x${ICON_SIZE} \) \
              -gravity center -composite \
              "$RES/$FOLDER/splash.png"
          done
          
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f $RES/mipmap-anydpi-v26/ic_launcher_round.xml || true
          
          echo "=== Icons done ==="

      - name: Copy google-services
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      - name: Fix AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          import re, os
          
          path = "android/app/src/main/AndroidManifest.xml"
          
          if not os.path.exists(path):
              print("Manifest not found!")
              exit(1)
          
          with open(path) as f:
              c = f.read()
          
          if "POST_NOTIFICATIONS" not in c:
              c = c.replace("</manifest>", 
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '</manifest>', 1)
          
          if "onesignal_app_id" not in c:
              m = re.search(r'(<application[^>]*>)', c)
              if m:
                  tag = m.group(1)
                  c = c.replace(tag, tag + '\n        <meta-data android:name="onesignal_app_id" android:value="58a1aed9-0e82-4063-8da0-bd9f19dc1b94" />', 1)
          
          with open(path, "w") as f:
              f.write(c)
          
          print("=== Manifest updated ===")
          PYEOF

      - name: Add OneSignal Gradle dependency
        run: |
          GRADLE=android/app/build.gradle
          if ! grep -q "com.onesignal:OneSignal" "$GRADLE"; then
            python3 -c "
          with open('$GRADLE','r') as f: c=f.read()
          c=c.replace('dependencies {', 'dependencies {\n    implementation \"com.onesignal:OneSignal:5.1.6\"', 1)
          with open('$GRADLE','w') as f: f.write(c)
          "
          fi

      - name: Update capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ourefootballtour.app",
            "appName": "OUR TOUR",
            "webDir": "www",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#05070e",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "androidSplashResourceName": "splash"
              },
              "OneSignal": {
                "appId": "58a1aed9-0e82-4063-8da0-bd9f19dc1b94"
              }
            }
          }
          EOF
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

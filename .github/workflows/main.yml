name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup www folder
        run: |
          mkdir -p www
          cp index.html www/ || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Install OneSignal Cordova plugin
        run: npm install onesignal-cordova-plugin@5 --legacy-peer-deps

      - name: Init Capacitor
        run: npx cap init "OUR TOUR" "com.ourefootballtour.app" --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Icons & Splash
        run: |
          echo "=== Checking icon.png ==="
          if [ ! -f icon.png ]; then
            echo "icon.png missing!"
            exit 1
          fi
          
          RES=android/app/src/main/res
          
          # App launcher icons
          for entry in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            convert icon.png -resize ${SIZE}x${SIZE} -background none -gravity center -extent ${SIZE}x${SIZE} "$RES/$FOLDER/ic_launcher.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_round.png"
            cp "$RES/$FOLDER/ic_launcher.png" "$RES/$FOLDER/ic_launcher_foreground.png"
          done
          
          # Splash screens
          for entry in "480:drawable" "720:drawable-hdpi" "1080:drawable-xhdpi" "1440:drawable-xxhdpi" "1920:drawable-xxxhdpi"; do
            SIZE="${entry%%:*}"
            FOLDER="${entry##*:}"
            mkdir -p "$RES/$FOLDER"
            ICON_SIZE=$((SIZE/3))
            convert -size ${SIZE}x${SIZE} xc:'#05070e' \
              \( icon.png -resize ${ICON_SIZE}x${ICON_SIZE} \) \
              -gravity center -composite \
              "$RES/$FOLDER/splash.png"
          done
          
          # Remove default Capacitor splash
          rm -f $RES/drawable/splash.png
          # Copy our new one
          cp $RES/drawable-xxxhdpi/splash.png $RES/drawable/splash.png || true
          
          # Remove adaptive icons
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          rm -f $RES/mipmap-anydpi-v26/ic_launcher_round.xml || true
          
          echo "=== Done ==="
          ls -la $RES/mipmap-xxxhdpi/

      - name: Add OneSignal Native SDK
        run: |
          GRADLE=android/app/build.gradle
          
          # Add OneSignal dependency
          if ! grep -q "com.onesignal:OneSignal" "$GRADLE"; then
            sed -i 's|^dependencies {|dependencies {\n    implementation "com.onesignal:OneSignal:5.1.6"|' "$GRADLE"
          fi
          
          echo "=== build.gradle deps ==="
          grep -A 10 "^dependencies {" "$GRADLE" | head -15

      - name: Add OneSignal App ID to strings.xml
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          
          if grep -q "onesignal_app_id" "$STRINGS"; then
            echo "Already added"
          else
            sed -i 's|</resources>|    <string name="onesignal_app_id">58a1aed9-0e82-4063-8da0-bd9f19dc1b94</string>\n</resources>|' "$STRINGS"
          fi
          
          cat "$STRINGS"

      - name: Configure AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          
          # Add permissions
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/></manifest>|' "$MANIFEST"
          fi
          
          # Add OneSignal meta-data
          if ! grep -q "onesignal_app_id" "$MANIFEST"; then
            sed -i 's|<application|<application\n        <meta-data android:name="onesignal_app_id" android:value="58a1aed9-0e82-4063-8da0-bd9f19dc1b94" />|' "$MANIFEST"
          fi
          
          cat "$MANIFEST"

      - name: Copy google-services
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
            echo "google-services.json copied"
          else
            echo "WARNING: google-services.json not found"
          fi

      - name: Update capacitor config for splash
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ourefootballtour.app",
            "appName": "OUR TOUR",
            "webDir": "www",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#05070e",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "androidSplashResourceName": "splash"
              },
              "OneSignal": {
                "appId": "58a1aed9-0e82-4063-8da0-bd9f19dc1b94"
              }
            }
          }
          EOF
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
